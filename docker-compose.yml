services:
  postgres:
    image: postgres:17.9-bookworm
    container_name: pg-rpz-base
    restart: always
    ports:
      - "5657:5657"
    command: -p 5657
    environment:
      POSTGRES_DB: rpz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5657"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  valkey:
    image: valkey/valkey:9.1-alpine
    container_name: valkey-rpz-base
    restart: always
    ports:
      - "6357:6379"
    volumes:
      - ./redis:/data/
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
