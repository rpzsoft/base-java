### This config is for local testing purpose only ####

app.name=rpz
app.home=.

app.conf=\
  db.properties,\
  auth.properties

app.env.prod=false
#app.env.prod=true
app.env.container=true

app.host=localhost
app.port=8443

# set the certificates
app.ssl = true
app.ssl.cafile=cert.pem
app.ssl.keyfile=key.pem

cors.enabled=true
cors.exception.for=/api
cors.access-control-allow-methods=GET, POST, PUT, DELETE, OPTIONS
cors.access-control-allow-headers=X-PINGOTHER, Content-Type, Authorization
cors.access-control-max-age=86400
cors.access-control-allow-origin=http://localhost:5173


